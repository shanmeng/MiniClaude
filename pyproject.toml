[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniclaude"
version = "0.1.0"
description = "A minimal, single-process coding agent in the style of Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
miniclaude = "miniclaude.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miniclaude"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Fixed, so red tests importing a not-yet-written module sort the same as green ones.
known-first-party = ["miniclaude"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY); skipped by default",
]
